plugins {
    id 'java-library'
}

def projectName = 'gdx-lwjgl3-angle-d3d11'
def gdxVersionValue = providers.gradleProperty('gdxVersion').getOrElse('1.14.2')
def lwjgl3VersionValue = providers.gradleProperty('lwjgl3Version').getOrElse('3.3.3')
def nativeLibsDir = file('libs')
def bundledWindowsNativeNames = ['d3dcompiler_47.dll', 'glfw3.dll', 'libEGL.dll', 'libGLESv2.dll']

group = 'com.github.fabiitch.gdx.lwjgl3'
version = providers.gradleProperty('VERSION_NAME').getOrElse('1.0.0-SNAPSHOT')

repositories {
    mavenCentral()
    google()
    maven { url = uri('https://oss.sonatype.org/content/repositories/snapshots/') }
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.fork = true
}

dependencies {
    api "com.badlogicgames.gdx:gdx:${gdxVersionValue}"
    api "com.badlogicgames.gdx:gdx-backend-lwjgl3:${gdxVersionValue}"

    implementation "net.java.dev.jna:jna:5.18.1"
    implementation "org.lwjgl:lwjgl-egl:${lwjgl3VersionValue}"
    implementation "org.lwjgl:lwjgl-opengles:${lwjgl3VersionValue}"
    implementation "org.lwjgl:lwjgl-opengles:${lwjgl3VersionValue}:natives-windows"

    // libGDX loads gdx64.dll through its SharedLibraryLoader at runtime.
    runtimeOnly "com.badlogicgames.gdx:gdx-platform:${gdxVersionValue}:natives-desktop"
}

tasks.register('verifyBundledWindowsNatives') {
    def nativeFiles = files(bundledWindowsNativeNames.collect { new File(nativeLibsDir, it) })
    inputs.files(nativeFiles)

    doLast {
        def missing = nativeFiles.files.findAll { !it.isFile() }
        if (!missing.isEmpty()) {
            throw new GradleException("Missing bundled Windows DLLs: ${missing*.path.join(', ')}")
        }
    }
}

tasks.named('processResources') {
    dependsOn tasks.named('verifyBundledWindowsNatives')
    exclude 'windows64/d3dcompiler_47.dll', 'windows64/glfw3.dll', 'windows64/libEGL.dll', 'windows64/libGLESv2.dll'
    from(nativeLibsDir) {
        include(bundledWindowsNativeNames as String[])
        into 'windows64'
    }
}

// The two classes under src/test are executable samples, not JUnit tests.
tasks.named('test') {
    failOnNoDiscoveredTests = false
}

jar {
    archiveBaseName.set(projectName)
    manifest {
        attributes(
                'Implementation-Title': projectName,
                'Implementation-Version': archiveVersion
        )
    }
}
